<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MODEX-Glove QR Code</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #141922;
      --muted: #5d687a;
      --line: rgba(17, 24, 39, 0.09);
      --primary: #2f5dff;
      --soft: #eef3fa;
      --shadow: 0 18px 40px rgba(20, 25, 34, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 28px 24px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: -0.06em;
    }

    .subtitle {
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .url-box {
      background: var(--soft);
      border: 1px solid #dfe7ff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.9rem;
      color: var(--primary);
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-bottom: 18px;
    }

    #qrcode {
      display: inline-block;
      background: white;
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: 16px;
      padding: 16px;
      margin: 8px auto 20px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(17, 24, 39, 0.16);
      background: rgba(255,255,255,0.8);
      color: var(--text);
      padding: 0.8rem 1.1rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(17, 24, 39, 0.06);
      border-color: rgba(47, 93, 255, 0.35);
    }

    .info {
      margin-top: 22px;
      text-align: left;
      background: var(--soft);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .card { padding: 20px 16px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>MODEX-Glove</h1>
    <div class="subtitle">Project Page QR Code</div>

    <div class="url-box">https://ZZY26-26-25.github.io/MODEX-Glove/</div>

    <div id="qrcode"></div>

    <div class="actions">
      <button type="button" onclick="downloadQR()">Download PNG</button>
      <button type="button" onclick="printQR()">Print</button>
    </div>

    <div class="info">
      <strong>使用说明：</strong><br />
      • 手机扫描可打开项目网页<br />
      • 可用于海报、汇报和论文页<br />
      • 下载二维码后可直接发给周边同事或打印
    </div>
  </div>

  <script>
    const url = 'https://ZZY26-26-25.github.io/MODEX-Glove/';
    const qrcodeEl = document.getElementById('qrcode');

    QRCode.toCanvas(qrcodeEl, url, {
      width: 260,
      margin: 1,
      color: {
        dark: '#141922',
        light: '#ffffff'
      }
    }, function (error) {
      if (error) console.error(error);
    });

    function downloadQR() {
      const canvas = qrcodeEl.querySelector('canvas');
      const link = document.createElement('a');
      link.download = 'MODEX-Glove-QR.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function printQR() {
      const canvas = qrcodeEl.querySelector('canvas');
      const printWindow = window.open('', '', 'width=500,height=600');
      printWindow.document.write('<html><head><title>MODEX-Glove QR</title></head><body style="display:flex;align-items:center;justify-content:center;margin:0;background:#f6f8fb;">');
      printWindow.document.write('<img src="' + canvas.toDataURL('image/png') + '" style="width:320px;height:320px;display:block;" />');
      printWindow.document.write('</body></html>');
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    }
  </script>
</body>
</html>
